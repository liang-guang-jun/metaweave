configuration:
  profiles:
    dev:
      priority: 100
    uat:
      priority: 200
    prod:
      priority: 300

app:
  name: metaweave
  debug: false
  frontend:
    type: static
    path: dist/client

server:
  host: 127.0.0.1
  port: 8000
  reload: false

  api:
    prefix: /api/v1

  cors:
    allow_origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
      - http://localhost:4173
      - http://127.0.0.1:4173
      - http://localhost:8000
      - http://127.0.0.1:8000
    allow_credentials: true

database:
  # Databricks Apps supplies PGHOST, PGPORT, PGDATABASE, PGUSER and PGSSLMODE.
  # LAKEBASE_ENDPOINT is wired from the App database resource in app.yaml.
  provider: databricks_lakebase
  driver: asyncpg
  auth:
    type: databricks_app
  echo: false

  pool:
    size: 5
    max_overflow: 10
    timeout_seconds: 30
    recycle_seconds: 1800

  options:
    busy_timeout_ms: 5000

logging:
  level: INFO
  json: false
  colors: false

  silenced_loggers:
    - uvicorn
    - sqlalchemy.engine

  log_request_headers: false

iam:
  identity:
    providers:
      local:
        enabled: true
      databricksapps:
        enabled: true
        ignore_status: false
        headers:
          email: X-Forwarded-Email
          access_token: X-Forwarded-Access-Token
  registration:
    enabled: true
    email:
      skip_verify: true

  password:
    min_length: 8
    require_upper: true
    require_digit: true
    require_symbol: true

  login:
    max_failures: 5
    lockout_seconds: 300

  token:
    issuer: iam
    audience: business-api
    secret: development-only-change-me
    header: X-Bearer-Token
    access_ttl_seconds: 3600
    refresh_ttl_seconds: 2592000

  acl:
    max_entries: 1000
    max_user_grants: 10000

    cache:
      enabled: false
      ttl_seconds: 30
