# This file is mandatory. It alone declares available overlay tags and priority.
# Existing files are merged after this file from lower to higher priority.
# Missing profile files are skipped; this registry defines the merge order.
configuration:
  profiles:
    dev:
      priority: 100
    uat:
      priority: 200
    prod:
      priority: 300

app:
  name: metaweave
  debug: false
  # Serve the built SPA from the HTTP root. `static` mounts `path` (resolved
  # against the repository root); `disabled` leaves the root unmounted.
  frontend:
    type: static
    path: dist/client

api:
  # All HTTP API routes live under this prefix so they never overlap the SPA's
  # client-side routes (for example /workspaces/{id}). Use "" for the root.
  prefix: /api/v1

database:
  # The deployed app has no durable volume, so the default is an in-process
  # SQLite database. Local development can switch back to a file-backed URL in
  # an overlay such as config.dev.yaml.
  url: "sqlite+aiosqlite:///:memory:"
  echo: false
  busy_timeout_ms: 5000

logging:
  level: INFO
  json: false
  colors: false
  silenced_loggers:
  #  []
    - uvicorn
    - sqlalchemy.engine
  log_request_headers: false

server:
  host: 127.0.0.1
  port: 8000
  reload: false

cors:
  # Browser origins allowed to call the API. Include the address the SPA is
  # opened from so `localhost` and `127.0.0.1` stay interchangeable.
  allow_origins:
    - http://localhost:5173
    - http://127.0.0.1:5173
    - http://localhost:4173
    - http://127.0.0.1:4173
    - http://localhost:8000
    - http://127.0.0.1:8000
  allow_credentials: true

password_policy:
  min_length: 8
  require_upper: true
  require_digit: true
  require_symbol: true
  max_failures: 5
  lockout_seconds: 300

token:
  issuer: iam
  audience: business-api
  secret: development-only-change-me
  # Header the API reads the access token from. Platforms such as Databricks
  # Apps reserve `Authorization` for their own SSO, so this dedicated header is
  # preferred; `Authorization: Bearer` stays accepted for plain API clients.
  header: X-Bearer-Token
  access_ttl_seconds: 3600
  refresh_ttl_seconds: 2592000

oidc:
  issuer: ""
  audience: ""
  client_id: ""

register:
  # Open the sign-up UI (reported as `register_enabled` by /healthz) and accept
  # POST /iam/users. When false, accounts can only be created by an admin.
  enabled: true
  email:
  # Skip the email-verification workflow: accounts created through the register
  # endpoint are marked verified immediately.
    skip_verify: true

acl:
  max_entries: 1000
  max_user_grants: 10000
  cache_enabled: false
  cache_ttl_seconds: 30
